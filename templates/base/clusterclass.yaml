apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: vultr
spec:
  controlPlane:
    # Name control plane objects <cluster>-control-plane-<random> instead of the
    # default <cluster>-<random>, so machine and node names say what they are.
    naming:
      template: "{{ .cluster.name }}-control-plane-{{ .random }}"
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: vultr-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        name: vultr-control-plane-machine
    # Replace a control plane machine whose node never appears or stays
    # NotReady. KubeadmControlPlane still refuses anything that would break
    # etcd quorum.
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 1200
        unhealthyNodeConditions:
        - type: Ready
          status: Unknown
          timeoutSeconds: 300
        - type: Ready
          status: "False"
          timeoutSeconds: 300
      remediation:
        triggerIf:
          unhealthyLessThanOrEqualTo: 100%
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: VultrClusterTemplate
      name: vultr-infrastructure
  workers:
    machineDeployments:
    - class: default-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: vultr-default-worker
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: VultrMachineTemplate
          name: vultr-default-worker-machine
      # Replace a worker whose node never appears or stays NotReady.
      healthCheck:
        checks:
          nodeStartupTimeoutSeconds: 600
          unhealthyNodeConditions:
          - type: Ready
            status: Unknown
            timeoutSeconds: 300
          - type: Ready
            status: "False"
            timeoutSeconds: 300
        remediation:
          triggerIf:
            unhealthyLessThanOrEqualTo: 100%
  variables:
  # Slot 0 of variables and of patches is the control plane. Flavors with a
  # different control plane kind (bare-metal-cp) replace that slot; everything
  # else is appended, so keep the control plane entries first.
  - name: CONTROL_PLANE_PLAN_ID
    required: true
    schema:
      openAPIV3Schema:
        type: string
  - name: REGION
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: ewr
  - name: WORKER_PLAN_ID
    required: true
    schema:
      openAPIV3Schema:
        type: string
  - name: VPC_ID
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  - name: MACHINE_IMAGE
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  - name: SSH_KEY_ID
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  - name: CONTROL_PLANE_MACHINE_COUNT
    required: false
    schema:
      openAPIV3Schema:
        type: integer
        default: 1
  - name: WORKER_MACHINE_COUNT
    required: false
    schema:
      openAPIV3Schema:
        type: integer
        default: 1
  - name: CLUSTER_CIDR
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: 172.25.0.0/16
  - name: SERVICE_CIDR
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: 172.26.0.0/16
  patches:
  # Everything the control plane machine template gets, in one patch (see the
  # note on slot 0 above).
  - name: CONTROL_PLANE
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/region
        valueFrom:
          variable: REGION
      - op: add
        path: /spec/template/spec/planID
        valueFrom:
          variable: CONTROL_PLANE_PLAN_ID
      - op: add
        path: /spec/template/spec/vpc_id
        valueFrom:
          variable: VPC_ID
      - op: add
        path: /spec/template/spec/snapshot_id
        valueFrom:
          variable: MACHINE_IMAGE
      - op: add
        path: /spec/template/spec/sshKey/-
        valueFrom:
          variable: SSH_KEY_ID
  - name: REGION
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/region
        valueFrom:
          variable: REGION
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/region
        valueFrom:
          variable: REGION
  - name: WORKER_PLAN_ID
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/planID
        valueFrom:
          variable: WORKER_PLAN_ID
  - name: VPC_ID
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/vpc_id
        valueFrom:
          variable: VPC_ID
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/vpc_id
        valueFrom:
          variable: VPC_ID
  - name: MACHINE_IMAGE
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/snapshot_id
        valueFrom:
          variable: MACHINE_IMAGE
  - name: SSH_KEY_ID
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VultrMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/sshKey/-
        valueFrom:
          variable: SSH_KEY_ID