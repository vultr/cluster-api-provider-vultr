apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: ${CLUSTER_NAME}-csi-manifests
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterSelector:
    matchLabels:
      csi: ${CLUSTER_NAME}-vultr
  resources:
  - kind: ConfigMap
    name: vultr-csi-manifests
  strategy: Reconcile
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vultr-csi-manifests
data:
  manifests: |
    apiVersion: storage.k8s.io/v1
    kind: CSIDriver
    metadata:
      name: block.csi.vultr.com
    spec:
      attachRequired: true
      podInfoOnMount: true
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-block-storage
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    parameters:
      storage_type: "block"
      disk_type: "nvme"
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-block-storage-retain
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    parameters:
      storage_type: "block"
      disk_type: "nvme"
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-block-storage-hdd
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    parameters:
      storage_type: "block"
      disk_type: "hdd"
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-block-storage-hdd-retain
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    parameters:
      storage_type: "block"
      disk_type: "hdd"
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-vfs-storage
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    parameters:
      storage_type: "vfs"
      disk_type: "nvme"
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: vultr-vfs-storage-retain
    provisioner: block.csi.vultr.com
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    parameters:
      storage_type: "vfs"
      disk_type: "nvme"
    ---
    kind: StatefulSet
    apiVersion: apps/v1
    metadata:
      name: csi-vultr-controller
      namespace: kube-system
    spec:
      serviceName: "csi-vultr"
      replicas: 2
      selector:
        matchLabels:
          app: csi-vultr-controller
      template:
        metadata:
          labels:
            app: csi-vultr-controller
            role: csi-vultr
        spec:
          serviceAccountName: csi-vultr-controller-sa
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: csi-vultr-controller
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: csi-provisioner
              image: registry.k8s.io/sig-storage/csi-provisioner:v3.4.0
              args:
                - "--volume-name-prefix=pvc"
                - "--volume-name-uuid-length=16"
                - "--csi-address=$(ADDRESS)"
                - "--leader-election=true"
                - "--timeout=90s"
                - "--v=5"
                - "--default-fstype=ext4"
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
              imagePullPolicy: "Always"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: csi-attacher
              image: registry.k8s.io/sig-storage/csi-attacher:v4.1.0
              args:
                - "--v=5"
                - "--csi-address=$(ADDRESS)"
                - "--leader-election=true"
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
              imagePullPolicy: "Always"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: csi-resizer
              image: registry.k8s.io/sig-storage/csi-resizer:v1.7.0
              args:
                - "--csi-address=$(ADDRESS)"
                - "--leader-election=true"
                - "--timeout=30s"
                - "--v=5"
                - "--handle-volume-inuse-error=false"
              env:
                - name: ADDRESS
                  value: /var/lib/csi/sockets/pluginproxy/csi.sock
              imagePullPolicy: "IfNotPresent"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: csi-vultr-plugin
              image: vultr/vultr-csi:v0.19.1
              args:
                - "--endpoint=$(CSI_ENDPOINT)"
                - "--token=$(VULTR_API_KEY)"
              env:
                - name: CSI_ENDPOINT
                  value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
                - name: VULTR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vultr-${CLUSTER_NAME}-csi-secret
                      key: api-key
              imagePullPolicy: "Always"
              volumeMounts:
                - name: socket-dir
                  mountPath: /var/lib/csi/sockets/pluginproxy/
          volumes:
            - name: socket-dir
              emptyDir: { }
    ---
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: csi-vultr-controller
      namespace: kube-system
    spec:
      minAvailable: 1
      selector:
        matchLabels:
          app: csi-vultr-controller
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: csi-vultr-controller-sa
      namespace: kube-system
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-attacher-role
    rules:
      - apiGroups: [ "" ]
        resources: [ "persistentvolumes" ]
        verbs: [ "get", "list", "watch", "update", "patch" ]
      - apiGroups: [ "" ]
        resources: [ "nodes" ]
        verbs: [ "get", "list", "watch" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "csinodes" ]
        verbs: [ "get", "list", "watch" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "volumeattachments" ]
        verbs: [ "get", "list", "watch", "update", "patch" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "volumeattachments/status" ]
        verbs: [ "patch" ]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-controller-attacher-binding
    subjects:
      - kind: ServiceAccount
        name: csi-vultr-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: csi-vultr-attacher-role
      apiGroup: rbac.authorization.k8s.io
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-provisioner-role
    rules:
      - apiGroups: [ "" ]
        resources: [ "secrets" ]
        verbs: [ "get", "list" ]
      - apiGroups: [ "" ]
        resources: [ "persistentvolumes" ]
        verbs: [ "get", "list", "watch", "create", "delete" ]
      - apiGroups: [ "" ]
        resources: [ "persistentvolumeclaims" ]
        verbs: [ "get", "list", "watch", "update" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "storageclasses" ]
        verbs: [ "get", "list", "watch" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "csinodes" ]
        verbs: [ "get", "list", "watch" ]
      - apiGroups: [ "" ]
        resources: [ "events" ]
        verbs: [ "list", "watch", "create", "update", "patch" ]
      - apiGroups: [ "" ]
        resources: [ "nodes" ]
        verbs: [ "get", "list", "watch" ]
      - apiGroups: [ "storage.k8s.io" ]
        resources: [ "volumeattachments" ]
        verbs: [ "get", "list", "watch" ]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-controller-provisioner-binding
    subjects:
      - kind: ServiceAccount
        name: csi-vultr-controller-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: csi-vultr-provisioner-role
      apiGroup: rbac.authorization.k8s.io
    ---
    kind: Role
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-snapshotter-leaderelection
      namespace: kube-system
    rules:
      - apiGroups: [ "coordination.k8s.io" ]
        resources: [ "leases" ]
        verbs: [ "get", "watch", "list", "delete", "update", "create" ]
    ---
    kind: RoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-snapshotter-leaderelection
      namespace: kube-system
    subjects:
      - kind: ServiceAccount
        name: csi-vultr-controller-sa
        namespace: kube-system
    roleRef:
      kind: Role
      name: csi-vultr-snapshotter-leaderelection
      apiGroup: rbac.authorization.k8s.io
    ---
    kind: DaemonSet
    apiVersion: apps/v1
    metadata:
      name: csi-vultr-node
      namespace: kube-system
    spec:
      selector:
        matchLabels:
          app: csi-vultr-node
      template:
        metadata:
          labels:
            app: csi-vultr-node
            role: csi-vultr
        spec:
          serviceAccountName: csi-vultr-node-sa
          hostNetwork: true
          containers:
            - name: driver-registrar
              image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.7.0
              args:
                - "--v=5"
                - "--csi-address=$(ADDRESS)"
                - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
              env:
                - name: ADDRESS
                  value: /csi/csi.sock
                - name: DRIVER_REG_SOCK_PATH
                  value: /var/lib/kubelet/plugins/block.csi.vultr.com/csi.sock
                - name: KUBE_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              volumeMounts:
                - name: plugin-dir
                  mountPath: /csi/
                - name: registration-dir
                  mountPath: /registration/
            - name: csi-vultr-plugin
              image: vultr/vultr-csi:v0.19.1
              args:
                - "--endpoint=$(CSI_ENDPOINT)"
              env:
                - name: CSI_ENDPOINT
                  value: unix:///csi/csi.sock
              imagePullPolicy: "Always"
              securityContext:
                privileged: true
                capabilities:
                  add: [ "SYS_ADMIN" ]
                allowPrivilegeEscalation: true
              volumeMounts:
                - name: plugin-dir
                  mountPath: /csi
                - name: pods-mount-dir
                  mountPath: /var/lib/kubelet
                  mountPropagation: "Bidirectional"
                - mountPath: /dev
                  name: device-dir
          volumes:
            - name: registration-dir
              hostPath:
                path: /var/lib/kubelet/plugins_registry/
                type: DirectoryOrCreate
            - name: kubelet-dir
              hostPath:
                path: /var/lib/kubelet
                type: Directory
            - name: plugin-dir
              hostPath:
                path: /var/lib/kubelet/plugins/block.csi.vultr.com
                type: DirectoryOrCreate
            - name: pods-mount-dir
              hostPath:
                path: /var/lib/kubelet
                type: Directory
            - name: device-dir
              hostPath:
                path: /dev
            - name: udev-rules-etc
              hostPath:
                path: /etc/udev
                type: Directory
            - name: udev-rules-lib
              hostPath:
                path: /lib/udev
                type: Directory
            - name: udev-socket
              hostPath:
                path: /run/udev
                type: Directory
            - name: sys
              hostPath:
                path: /sys
                type: Directory
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: csi-vultr-node-sa
      namespace: kube-system
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: driver-registrar-binding
    subjects:
      - kind: ServiceAccount
        name: csi-vultr-node-sa
        namespace: kube-system
    roleRef:
      kind: ClusterRole
      name: csi-vultr-node-driver-registrar-role
      apiGroup: rbac.authorization.k8s.io
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-node-driver-registrar-role
    rules:
      - apiGroups: [ "" ]
        resources: [ "events" ]
        verbs: [ "get", "list", "watch", "create", "update", "patch" ]
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-resizer-role
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "watch", "update", "patch"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims/status"]
        verbs: ["update", "patch"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list", "watch", "create", "update", "patch"]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: csi-vultr-resizer-binding
    subjects:
      - kind: ServiceAccount
        name: csi-vultr-controller-sa
        namespace: kube-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: csi-vultr-resizer-role
---
apiVersion: v1
kind: Secret
metadata:
  name: vultr-${CLUSTER_NAME}-csi-secret
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
stringData:
  vultr-csi.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: vultr-${CLUSTER_NAME}-csi-secret
      namespace: kube-system
    type: Opaque
    stringData:
      api-key: ${VULTR_API_KEY}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: ${CLUSTER_NAME}-csi-secret
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterSelector:
    matchLabels:
      csi: ${CLUSTER_NAME}-vultr
  resources:
  - kind: Secret
    name: vultr-${CLUSTER_NAME}-csi-secret
  strategy: Reconcile