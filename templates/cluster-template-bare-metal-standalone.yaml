---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 172.25.0.0/16
    services:
      cidrBlocks:
        - 172.26.0.0/16
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: VultrCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VultrCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  region: "${REGION}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: "${KUBERNETES_VERSION}"
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VultrMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    initConfiguration:
      # wait for the Vultr load balancer to start forwarding (kubeadm default is 60s)
      timeouts:
        kubernetesAPICallSeconds: 300
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
          - name: cgroup-driver
            value: systemd
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "vultr://{{ ds.meta_data['instance_id'] }}"
    joinConfiguration:
      # wait for the Vultr load balancer to start forwarding (kubeadm default is 60s)
      timeouts:
        kubernetesAPICallSeconds: 300
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
          - name: cgroup-driver
            value: systemd
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "vultr://{{ ds.meta_data['instance_id'] }}"

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VultrMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      region: "${REGION}"
      planID: "${CONTROL_PLANE_PLAN_ID}"
      vpc_id: "${VPC_ID}"
      snapshot_id: "${MACHINE_IMAGE}"
      sshKey:
        - "${SSH_KEY_ID}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VultrMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VultrMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      region: "${REGION}"
      planID: "${WORKER_PLAN_ID}"
      vpc_id: "${VPC_ID}"
      snapshot_id: "${MACHINE_IMAGE}"
      sshKey:
        - "${SSH_KEY_ID}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
            - name: cgroup-driver
              value: systemd
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
            - name: provider-id
              value: "vultr://{{ ds.meta_data['instance_id'] }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-bm-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${BARE_METAL_WORKER_MACHINE_COUNT:=1}
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-bm-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VultrBareMetalMachineTemplate
        name: "${CLUSTER_NAME}-bm-0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VultrBareMetalMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-bm-0"
spec:
  template:
    spec:
      region: "${REGION}"
      planID: "${BARE_METAL_PLAN_ID}"
      osID: ${BARE_METAL_OS_ID:=2284}
      # Add vpcID: <vpc id> only on plans that support VPC networking.
      sshKey:
        - "${SSH_KEY_ID}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-bm-0"
spec:
  template:
    spec:
      files:
      - path: /usr/local/bin/install-k8s.sh
        owner: root:root
        permissions: "0755"
        content: |
          #!/usr/bin/env bash
          # Installs containerd and the Kubernetes packages for the requested version on
          # a stock Ubuntu 24.04 image. Run by Cluster API before kubeadm join.
          set -euo pipefail
          VERSION="$${1#v}"
          MINOR="$${VERSION%.*}"
          export DEBIAN_FRONTEND=noninteractive
          # Stock images ship with ufw enabled (SSH only); Kubernetes and the load balancer
          # health checks need the node reachable.
          ufw disable 2>/dev/null || true
          # Stock images run unattended upgrades at boot; do not fight them for the apt lock.
          systemctl stop --now apt-daily.timer apt-daily-upgrade.timer unattended-upgrades 2>/dev/null || true
          apt_get() { local n; for n in 1 2 3 4 5; do apt-get -o DPkg::Lock::Timeout=600 "$@" && return 0; sleep 15; done; return 1; }
          swapoff -a
          sed -i "/\\sswap\\s/s/^/#/" /etc/fstab
          printf "overlay\nbr_netfilter\n" > /etc/modules-load.d/k8s.conf
          modprobe overlay
          modprobe br_netfilter
          cat > /etc/sysctl.d/99-kubernetes.conf <<SYSCTL
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
          SYSCTL
          sysctl --system > /dev/null
          apt_get update -q
          apt_get install -y -q apt-transport-https ca-certificates curl gpg containerd
          mkdir -p /etc/containerd
          containerd config default > /etc/containerd/config.toml
          sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
          # containerd 1.x uses sandbox_image, 2.x uses sandbox (under pinned_images)
          sed -i -E "s#^(\s*)sandbox_image = .*#\1sandbox_image = \"registry.k8s.io/pause:3.10\"#; s#^(\s*)sandbox = .*#\1sandbox = \"registry.k8s.io/pause:3.10\"#" /etc/containerd/config.toml
          systemctl enable --now containerd
          systemctl restart containerd
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL --retry 5 --retry-delay 10 "https://pkgs.k8s.io/core:/stable:/v$${MINOR}/deb/Release.key" | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$${MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
          apt_get update -q
          apt_get install -y -q "kubelet=$${VERSION}-*" "kubeadm=$${VERSION}-*" "kubectl=$${VERSION}-*"
          apt-mark hold kubelet kubeadm kubectl
      preKubeadmCommands:
      - /usr/local/bin/install-k8s.sh ${KUBERNETES_VERSION}
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
            - name: cgroup-driver
              value: systemd
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
            - name: cloud-provider
              value: external
            - name: node-labels
              value: vultr.com/baremetal=true
            - name: provider-id
              value: "vultr://{{ ds.meta_data['instance_id'] }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ""
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyNodeConditions:
    - type: Ready
      status: Unknown
      timeoutSeconds: 300
    - type: Ready
      status: "False"
      timeoutSeconds: 300
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: "${CLUSTER_NAME}-md-0"
  checks:
    nodeStartupTimeoutSeconds: 600
    unhealthyNodeConditions:
    - type: Ready
      status: Unknown
      timeoutSeconds: 300
    - type: Ready
      status: "False"
      timeoutSeconds: 300
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-bm-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: "${CLUSTER_NAME}-bm-0"
  checks:
    nodeStartupTimeoutSeconds: 1800
    unhealthyNodeConditions:
    - type: Ready
      status: Unknown
      timeoutSeconds: 300
    - type: Ready
      status: "False"
      timeoutSeconds: 300
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
